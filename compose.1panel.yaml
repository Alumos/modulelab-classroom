services:
  classroom:
    image: ghcr.io/alumos/modulelab-classroom:latest
    restart: unless-stopped
    environment:
      TEACHER_PASSWORD: ${TEACHER_PASSWORD:?Set TEACHER_PASSWORD in the 1Panel environment file}
      COOKIE_SECURE: "true"
    ports:
      - "127.0.0.1:18326:8080"
    volumes:
      - classroom_data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - "no-new-privileges:true"

volumes:
  classroom_data:
