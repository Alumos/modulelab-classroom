services:
  classroom:
    build: .
    restart: unless-stopped
    environment:
      TEACHER_PASSWORD: ${TEACHER_PASSWORD:-2026}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    ports:
      - "${BIND_IP:-127.0.0.1}:${WEB_PORT:-18326}:8080"
    volumes:
      - classroom_data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - "no-new-privileges:true"

volumes:
  classroom_data:
